<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerStream — Recruitment Management Platform</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #1f2937; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-size: 14px; margin-right: 6px; font-weight: 500; }
    .btn { display: inline-block; padding: 12px 24px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin-right: 12px; }
    .btn-outline { background: transparent; color: #1f2937; border: 1px solid #d1d5db; }
  </style>
</head>
<body>
  <h1>CareerStream</h1>
  <p>Full-stack recruitment and applicant tracking system built with Spring Boot and JSP, deployed via Docker on Oracle Cloud.</p>

  <div>
    <span class="badge">Java / Spring Boot</span>
    <span class="badge">JSP</span>
    <span class="badge">Docker</span>
    <span class="badge">Oracle Cloud (OCI)</span>
  </div>

  <p style="margin-top: 32px;">
    <a id="live-btn" class="btn" href="#" target="_blank">Connecting to Live Server...</a>
    <a class="btn btn-outline" href="https://github.com/neerajsait/RecruiterService" target="_blank">View Source on GitHub</a>
  </p>

  <script>
    // Fetches the latest Cloudflare tunnel URL from your GitHub Gist
    fetch("https://raw.githubusercontent.com/neerajsait/RecruiterService/master/docs/tunnel-url.json?t=" + Date.now())
      .then(res => res.json())
      .then(data => {
        const btn = document.getElementById("live-btn");
        btn.href = data.url;
        btn.textContent = "Launch Live Demo →";
      })
      .catch(() => {
        document.getElementById("live-btn").textContent = "Live Server Restarting (Check GitHub)";
      });
  </script>
</body>
</html>
